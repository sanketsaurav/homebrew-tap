name: Bottle

# Builds prebuilt bottles so `brew install` pours them instead of compiling.
# Runs when a formula changes on main (a project's release workflow pushes a
# regenerated formula via a PAT, which triggers this), or on manual dispatch.
# Each bottle is uploaded to a release in this repo and the bottle block is
# committed back to the formula.

on:
  push:
    branches: [main]
    paths: ["Formula/**"]
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to bottle (blank on push = the changed ones)"
        required: false

permissions:
  contents: write

jobs:
  bottle:
    # The bottle-block commit is pushed with GITHUB_TOKEN (which does not
    # re-trigger workflows); the message check is belt-and-suspenders.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'add bottle') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pick formulae to bottle
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.formula }}" ]; then
            list="${{ github.event.inputs.formula }}"
          else
            list="$(git diff --name-only HEAD^ HEAD -- 'Formula/*.rb' \
              | xargs -r -n1 basename | sed 's/\.rb$//' | tr '\n' ' ')"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "picked:${list:- (none)}"

      - name: Build and bottle
        if: steps.pick.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euxo pipefail

          # Expose the checkout as the sanketsaurav/tap tap so brew can load the
          # formulae; edits by `brew bottle --merge` land back in this checkout.
          tap_dir="$(brew --repository)/Library/Taps/sanketsaurav/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$PWD" "$tap_dir"

          for formula_name in ${{ steps.pick.outputs.list }}; do
            ref="sanketsaurav/tap/$formula_name"
            version="$(grep -oE "$formula_name-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz" "Formula/$formula_name.rb" \
              | head -1 | sed -E "s/$formula_name-(.*)\.tar\.gz/\1/")"
            tag="$formula_name-$version"
            root="https://github.com/${{ github.repository }}/releases/download/$tag"

            rm -f ./*.bottle.tar.gz ./*.bottle.json
            brew install --build-bottle "$ref"
            brew bottle --json --no-rebuild --root-url="$root" "$ref"
            # brew names the file with `--`; the download URL uses a single `-`.
            for f in ./*.bottle.tar.gz; do mv "$f" "${f/--/-}"; done

            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "$tag" --notes "Prebuilt bottle for $formula_name $version." || true
            gh release upload "$tag" ./"$formula_name"-"$version".*.bottle.tar.gz \
              --repo "${{ github.repository }}" --clobber

            brew bottle --merge --write --no-commit ./"$formula_name"--"$version".*.bottle.json
          done

      - name: Commit the bottle blocks
        if: steps.pick.outputs.list != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git diff --cached --quiet || git commit -m "add bottle: ${{ steps.pick.outputs.list }}"
          git push
