name: Bottle

# Builds prebuilt bottles so `brew install` pours them instead of compiling.
# Runs when a formula changes on main (a project's release workflow pushes a
# regenerated formula via a PAT, which triggers this), or on manual dispatch.
# One build job per macOS version compiles and uploads its own bottle to a
# release in this repo; the merge job then combines the per-platform JSONs
# into a single bottle block and commits it back to the formula. Homebrew
# only pours a bottle whose OS tag matches the host exactly, so every macOS
# users run needs its own matrix leg.

on:
  push:
    branches: [main]
    paths: ["Formula/**"]
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to bottle (blank on push = the changed ones)"
        required: false

permissions:
  contents: write

jobs:
  pick:
    # The bottle-block commit is pushed with GITHUB_TOKEN (which does not
    # re-trigger workflows); the message check is belt-and-suspenders.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'add bottle') }}
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pick formulae to bottle
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.formula }}" ]; then
            list="${{ github.event.inputs.formula }}"
          else
            list="$(git diff --name-only HEAD^ HEAD -- 'Formula/*.rb' \
              | xargs -r -n1 basename | sed 's/\.rb$//' | tr '\n' ' ')"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "picked:${list:- (none)}"

  build:
    needs: pick
    if: ${{ needs.pick.outputs.list != '' }}
    strategy:
      # One leg per macOS users install on; each produces its own bottle tag
      # (macos-15 = arm64_sequoia, macos-26 = arm64_tahoe). Add new majors
      # here as GitHub ships runners for them. fail-fast off so one broken
      # image does not stop the other platform's bottle.
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and bottle
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euxo pipefail

          # Expose the checkout as the sanketsaurav/tap tap so brew can load
          # the formulae.
          tap_dir="$(brew --repository)/Library/Taps/sanketsaurav/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$PWD" "$tap_dir"

          for formula_name in ${{ needs.pick.outputs.list }}; do
            ref="sanketsaurav/tap/$formula_name"
            version="$(grep -oE "$formula_name-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz" "Formula/$formula_name.rb" \
              | head -1 | sed -E "s/$formula_name-(.*)\.tar\.gz/\1/")" || true
            if [ -z "$version" ]; then
              # Prebuilt-binary formulae (e.g. portia) have no source tarball -
              # there's nothing to compile, so a bottle would add nothing.
              echo "skipping $formula_name: no source tarball, nothing to bottle"
              continue
            fi
            tag="$formula_name-$version"
            root="https://github.com/${{ github.repository }}/releases/download/$tag"

            brew install --build-bottle "$ref"
            brew bottle --json --no-rebuild --root-url="$root" "$ref"
            # brew names the file with `--`; the download URL uses a single `-`.
            for f in ./"$formula_name"--*.bottle.tar.gz; do mv "$f" "${f/--/-}"; done

            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "$tag" --notes "Prebuilt bottle for $formula_name $version." || true
            gh release upload "$tag" ./"$formula_name"-"$version".*.bottle.tar.gz \
              --repo "${{ github.repository }}" --clobber
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bottle-json-${{ matrix.os }}
          path: "*.bottle.json"
          if-no-files-found: ignore

  merge:
    # not cancelled(): still merge the platforms that did build when one
    # matrix leg fails, so a broken runner image degrades coverage instead
    # of blocking bottling entirely (the failed leg still fails the run).
    needs: [pick, build]
    if: ${{ !cancelled() && needs.pick.outputs.list != '' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bottle-json-*
          merge-multiple: true

      - name: Merge bottle blocks and commit
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euxo pipefail
          shopt -s nullglob

          # Same tap symlink trick: `brew bottle --merge --write` edits the
          # formula inside this checkout.
          tap_dir="$(brew --repository)/Library/Taps/sanketsaurav/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$PWD" "$tap_dir"

          merged=""
          for formula_name in ${{ needs.pick.outputs.list }}; do
            jsons=(./"$formula_name"--*.bottle.json)
            [ ${#jsons[@]} -gt 0 ] || continue
            brew bottle --merge --write --no-commit "${jsons[@]}"
            merged="$merged $formula_name"
          done
          if [ -z "$merged" ]; then
            echo "nothing bottled; nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git diff --cached --quiet || git commit -m "add bottle:$merged"
          git push
